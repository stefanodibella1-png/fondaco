<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Control center Fondaco: personalizza l'app della tua struttura.">
<meta name="theme-color" content="#16203a">
<meta property="og:title" content="Fondaco">
<meta property="og:description" content="Control center Fondaco: personalizza l'app della tua struttura.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23b3261e'/%3E%3Ctext x='32' y='46' text-anchor='middle' font-family='Georgia,serif' font-size='40' fill='%23f6efe0'%3EF%3C/text%3E%3C/svg%3E">
<title>Fondaco Control Center</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Abril+Fatface&family=Albert+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: banco di lavoro dell'host in tre colonne: sezioni a sinistra, modulo al centro, telefono con l'app dal vivo a destra. Su telefono le sezioni diventano una fila di chip e l'anteprima scende sotto. */
:root{
  --bg:#f3ecdc; --surface:#fffaf0; --ink:#1c1712; --muted:#6a5f52; --line:#e2d5bd; --field:#fbf6ea;
  --rosso:#b3261e; --giallo:#f2b705; --verde:#1e7a46; --blu:#1b3f94; --notte:#16203a; --cream:#f6efe0;
  --display:"Abril Fatface", "Bodoni 72", Didot, Georgia, serif;
  --body:"Albert Sans", "Segoe UI", system-ui, sans-serif;
  --mono:"JetBrains Mono", ui-monospace, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#121110;--surface:#1c1a17;--ink:#f3ead8;--muted:#b3a792;--line:#34302a;--field:#24211d;--rosso:#d9473c;--verde:#3fa36b;--blu:#5b82e0;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121110;--surface:#1c1a17;--ink:#f3ead8;--muted:#b3a792;--line:#34302a;--field:#24211d;--rosso:#d9473c;--verde:#3fa36b;--blu:#5b82e0;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--giallo);outline-offset:2px}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;line-height:1.08;text-wrap:balance}
.fascia{height:7px;background-image:var(--fascia);background-size:28px 7px}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--surface);border-bottom:1px solid var(--line)}
.bar .w{display:flex;align-items:center;gap:14px;padding-block:10px;flex-wrap:wrap}
.w{max-width:1320px;margin:0 auto;padding-inline:20px}
.brand{font-family:var(--display);font-size:1.45rem;color:var(--rosso);text-decoration:none}
.brand small{font-family:var(--mono);font-size:.68rem;color:var(--muted);letter-spacing:.1em;margin-left:8px;vertical-align:middle}
.who{display:flex;align-items:center;gap:10px;margin-left:auto;min-width:0}
.who .sw{width:34px;height:34px;border-radius:6px;background-size:100% 100%;flex:none}
.who b{display:block;font-size:.92rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:22ch}
.who small{color:var(--muted);font-size:.76rem}
.saved{font-size:.78rem;color:var(--muted);font-family:var(--mono)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:6px;padding:9px 16px;font-weight:700;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn.red{background:var(--rosso);color:#fff}
.btn.line{background:none;border:1.5px solid var(--line);color:var(--ink)}
.btn.sm{padding:6px 11px;font-size:.84rem}

.status{display:flex;gap:10px;flex-wrap:wrap;padding-block:16px 4px}
.pill{display:flex;gap:8px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:5px 12px 5px 8px;font-size:.82rem}
.pill i{width:9px;height:9px;border-radius:50%;background:var(--verde)}
.pill.warn i{background:var(--giallo)}
.pill b{font-weight:700}

.grid{display:grid;grid-template-columns:200px minmax(0,1fr) 340px;gap:24px;align-items:start;padding-block:16px 48px}
.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px);display:grid;gap:2px}
.side button{display:flex;align-items:center;gap:10px;border:0;background:none;text-align:left;padding:9px 12px;border-radius:8px;cursor:pointer;font-weight:600;color:var(--muted)}
.side button svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.side button[aria-current="true"]{background:var(--surface);color:var(--ink);box-shadow:inset 3px 0 0 var(--rosso)}
.side .sep{height:1px;background:var(--line);margin:8px 0}
.main{display:grid;gap:18px;min-width:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:22px;display:grid;gap:18px}
.panel h2{font-size:1.75rem}
.panel>p.lead{margin:-8px 0 0;color:var(--muted);max-width:62ch}
.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 16px}
.f{display:grid;gap:5px;min-width:0}
.f.full{grid-column:1 / -1}
.f>span{font-size:.84rem;font-weight:600}
.f small{color:var(--muted);font-size:.78rem}
.f input[type=text],.f input[type=number],.f input[type=time],.f select,.f textarea{width:100%;min-width:0;background:var(--field);border:1px solid var(--line);border-radius:7px;padding:9px 11px}
.f textarea{min-height:76px;resize:vertical}
.sws{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.sws button{width:34px;height:34px;border-radius:50%;border:3px solid var(--surface);box-shadow:0 0 0 1px var(--line);cursor:pointer}
.sws button[aria-pressed="true"]{box-shadow:0 0 0 2px var(--ink)}
.sws input[type=color]{width:38px;height:38px;border:0;background:none;padding:0;cursor:pointer}
.tiles{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.tiles button{aspect-ratio:1;max-width:100%;border:0;border-radius:6px;background-size:100% 100%;cursor:pointer;box-shadow:0 0 0 1px var(--line)}
.tiles button[aria-pressed="true"]{box-shadow:0 0 0 3px var(--rosso)}
.tog{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.tog input{appearance:none;width:40px;height:23px;border-radius:999px;background:var(--line);position:relative;cursor:pointer;flex:none;margin:1px 0 0;transition:background .2s}
.tog input::after{content:"";position:absolute;top:3px;left:3px;width:17px;height:17px;border-radius:50%;background:#fff;transition:left .2s;box-shadow:0 1px 2px rgba(0,0,0,.3)}
.tog input:checked{background:var(--verde)}
.tog input:checked::after{left:20px}
.tog b{display:block;font-size:.92rem}
.tog small{color:var(--muted);font-size:.8rem}
.list{display:grid;gap:8px}
.li{display:grid;grid-template-columns:minmax(0,1fr) 90px auto auto;gap:8px;align-items:center;background:var(--field);border:1px solid var(--line);border-radius:8px;padding:8px}
.li.r{grid-template-columns:minmax(0,1fr) auto}
.li.c{grid-template-columns:120px minmax(0,1fr) minmax(0,1.3fr) auto}
.li input,.li select{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:7px 9px;width:100%;min-width:0}
.li .del{border:0;background:none;width:30px;height:30px;border-radius:6px;cursor:pointer;color:var(--muted);font-size:1.1rem}
.li .del:hover{background:var(--line)}
.li .mini{appearance:none;width:34px;height:20px;border-radius:999px;background:var(--line);position:relative;cursor:pointer;margin:0}
.li .mini::after{content:"";position:absolute;top:3px;left:3px;width:14px;height:14px;border-radius:50%;background:#fff;transition:left .2s}
.li .mini:checked{background:var(--verde)}.li .mini:checked::after{left:17px}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.day{display:grid;gap:4px;text-align:center;font-size:.76rem;font-weight:700;color:var(--muted)}
.day select{width:100%;min-width:0;background:var(--field);border:1px solid var(--line);border-radius:6px;padding:6px 2px;font-size:.78rem;text-align:center}
.range{display:flex;align-items:center;gap:14px}
.range input{flex:1;accent-color:var(--rosso)}
.range output{font-family:var(--display);font-size:2rem;min-width:3.4ch;text-align:right;font-variant-numeric:tabular-nums}
.qrbox{display:grid;grid-template-columns:auto minmax(0,1fr);gap:22px;align-items:center}
.maj{width:220px;height:220px;max-width:100%;border-radius:8px;background-size:100% 100%;display:grid;place-items:center;box-shadow:0 18px 30px -16px rgba(0,0,0,.45),inset 0 0 0 1px rgba(0,0,0,.1)}
.maj .disc{width:58%;aspect-ratio:1;background:#fbf7ee;border-radius:50%;display:grid;place-items:center;box-shadow:0 0 0 4px var(--blu)}
.maj #qr{width:66%;aspect-ratio:1;display:grid;place-items:center}
.maj #qr img,.maj #qr canvas{width:100%!important;height:auto!important}
.url{font-family:var(--mono);font-size:.84rem;background:var(--field);border:1px solid var(--line);border-radius:6px;padding:8px 10px;word-break:break-all}
pre.json{margin:0;max-height:440px;overflow:auto;background:var(--notte);color:#e9e4d6;border-radius:8px;padding:14px;font-family:var(--mono);font-size:.76rem;line-height:1.55}

/* Telefono */
.prev{position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px);display:grid;gap:10px;justify-items:center}
.prev .lang{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px}
.prev .lang button{border:0;background:none;border-radius:999px;padding:4px 12px;font-weight:700;font-size:.8rem;cursor:pointer;color:var(--muted)}
.prev .lang button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.phone{width:300px;max-width:100%;border-radius:40px;background:#0e0d0c;padding:11px;box-shadow:0 40px 60px -30px rgba(0,0,0,.55)}
.scr{position:relative;border-radius:30px;overflow:hidden;background:#fbf7ee;color:#1c1712;height:600px;display:grid;grid-template-rows:minmax(0,1fr) auto;font-size:13px}
.view{overflow:auto;scrollbar-width:none}
.view::-webkit-scrollbar{display:none}
.hero{position:relative;padding:44px 18px 18px;color:#fff;display:grid;gap:4px;background-size:cover;background-position:center}
.hero::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.05),rgba(0,0,0,.45))}
.hero>*{position:relative}
.hero small{opacity:.9;font-size:.74rem;letter-spacing:.06em;text-transform:uppercase}
.hero b{font-family:var(--display);font-weight:400;font-size:1.7rem;line-height:1.05}
.band{height:16px;background-size:16px 16px;background-repeat:repeat-x}
.body{padding:12px;display:grid;gap:9px}
.wel{font-size:.86rem;color:#4a4036;line-height:1.45;padding:2px 4px}
.card{background:#fff;border-radius:12px;padding:11px 13px;display:grid;gap:3px;box-shadow:0 1px 0 rgba(0,0,0,.05)}
.card .k{font-size:.64rem;color:#7a6e60;text-transform:uppercase;letter-spacing:.09em;font-weight:700}
.card b{font-size:.92rem}
.card .s{font-size:.78rem;color:#6a5f52}
.two{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.copy{justify-self:start;border:0;border-radius:6px;padding:3px 8px;font-size:.72rem;font-weight:700;margin-top:3px;color:#fff}
.lock{font-size:.72rem;color:#7a6e60}
.svcrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;padding:7px 0;border-top:1px solid #f0e8d8}
.svcrow:first-of-type{border-top:0}
.svcrow .p{font-family:var(--mono);font-size:.78rem}
.add{border:0;border-radius:999px;padding:4px 10px;font-size:.72rem;font-weight:700;color:#fff}
.tip{display:grid;gap:1px;padding:7px 0;border-top:1px solid #f0e8d8}.tip:first-of-type{border-top:0}
.tip span{font-size:.64rem;text-transform:uppercase;letter-spacing:.08em;font-weight:700}
.chat{display:grid;gap:8px;padding:6px 0}
.msg{max-width:82%;padding:8px 11px;border-radius:14px;font-size:.82rem}
.msg.h{background:#fff;justify-self:start;border-bottom-left-radius:4px}
.msg.g{color:#fff;justify-self:end;border-bottom-right-radius:4px}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);background:#fff;border-top:1px solid #eee3cf;padding:6px 6px 14px}
.tabs button{border:0;background:none;display:grid;justify-items:center;gap:2px;font-size:.66rem;font-weight:700;color:#8a7e70;cursor:pointer;padding:4px}
.tabs svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.prev .cap{font-size:.78rem;color:var(--muted);text-align:center;max-width:32ch}

.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:8px;font-size:.88rem;z-index:30;max-width:calc(100vw - 32px)}

@media (max-width:1100px){.grid{grid-template-columns:180px minmax(0,1fr)}.prev{position:static;grid-column:1 / -1}}
@media (max-width:760px){
  .grid{grid-template-columns:minmax(0,1fr)}
  .side{position:static;display:flex;overflow-x:auto;gap:6px;padding-bottom:4px;scrollbar-width:none}
  .side button{flex:none;padding:7px 12px;background:var(--surface);border:1px solid var(--line)}
  .side button[aria-current="true"]{box-shadow:none;background:var(--ink);color:var(--surface)}
  .side .sep{display:none}
  .fields{grid-template-columns:minmax(0,1fr)}
  .tiles{grid-template-columns:repeat(4,minmax(0,1fr))}
  .li{grid-template-columns:minmax(0,1fr) 72px auto}
  .li .mini{grid-column:1}
  .li.c{grid-template-columns:minmax(0,1fr) auto}
  .li.c input:not(:first-of-type),.li.c select{grid-column:1}
  .qrbox{grid-template-columns:minmax(0,1fr);justify-items:center}
  .week{grid-template-columns:repeat(4,minmax(0,1fr))}
  .who .meta{display:none}
}
@media (prefers-reduced-motion:reduce){.tog input,.tog input::after{transition:none}}
</style>
</head>
<body>


<header class="bar">
  <div class="fascia"></div>
  <div class="w">
    <a class="brand" href="/">Fondaco<small>CONTROL CENTER</small></a>
    <div class="who"><span class="sw" id="who-sw"></span><span class="meta" style="min-width:0"><b id="who-n"></b><small id="who-t"></small></span></div>
    <span class="saved" id="saved">Salvato sul dispositivo</span>
    <button class="btn red" type="button" id="pub">Pubblica</button>
  </div>
</header>

<div class="w">
  <div class="status" aria-label="Stato della struttura">
    <span class="pill"><i></i>Abbonamento <b>attivo</b> · 12 € l'anno</span>
    <span class="pill"><i></i>CIN <b>verificato</b></span>
    <span class="pill warn"><i></i><b>3 ospiti</b> con soggiorno attivo</span>
    <span class="pill"><i></i>Luce accesa sull'isola</span>
  </div>
  <div class="grid">
    <nav class="side" id="side" aria-label="Sezioni del control center"></nav>
    <main class="main" id="main"></main>
    <aside class="prev" aria-label="Anteprima dell'app">
      <div class="lang" role="group" aria-label="Lingua dell'anteprima"><button type="button" data-lang="it" aria-pressed="true">IT</button><button type="button" data-lang="en" aria-pressed="false">EN</button></div>
      <div class="phone"><div class="scr"><div class="view" id="view"></div><nav class="tabs" id="tabs"></nav></div></div>
      <p class="cap">L'app come la vede l'ospite. Ogni modifica compare subito.</p>
    </aside>
  </div>
</div>
<div class="toast" id="toast" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}
const PAL={
 classic:{ground:"#f3ead6",corner:"#1f3f8f",cornerIn:"#e7a321",leaf:"#2e7d4f",petal:"#e7a321",petal2:"#d9661f",line:"#5a3a22"},
 verde:{ground:"#f3ead6",corner:"#2e7d4f",cornerIn:"#e7a321",leaf:"#1f3f8f",petal:"#e7a321",petal2:"#1f3f8f",line:"#5a3a22"},
 manganese:{ground:"#f1e6cf",corner:"#5a3a22",cornerIn:"#e7a321",leaf:"#2e7d4f",petal:"#1f3f8f",petal2:"#e7a321",line:"#3b2616"},
 arancio:{ground:"#f4ecd9",corner:"#d9661f",cornerIn:"#1f3f8f",leaf:"#2e7d4f",petal:"#1f3f8f",petal2:"#e7a321",line:"#5a3a22"},
 blu:{ground:"#eef0ea",corner:"#1f3f8f",cornerIn:"#8fb0dd",leaf:"#1f3f8f",petal:"#8fb0dd",petal2:"#1f3f8f",line:"#1c2a5a"},
 bordeaux:{ground:"#f6eedf",corner:"#6b1d2a",cornerIn:"#c79a3b",leaf:"#2e7d4f",petal:"#c79a3b",petal2:"#6b1d2a",line:"#3b1a14"},
 lava:{ground:"#efe9df",corner:"#2b2826",cornerIn:"#d4582a",leaf:"#2e7d4f",petal:"#d4582a",petal2:"#e7a321",line:"#1b1a19"}
};
const _tileCache={};
function makeTile(name,seed=7,size=240){
  const key=name+seed+size;if(_tileCache[key])return _tileCache[key];
  const p=PAL[name]||PAL.classic,cv=document.createElement("canvas");cv.width=cv.height=size;
  const x=cv.getContext("2d"),r=mulberry32(seed),J=a=>(r()-.5)*a,s=size/100;
  x.fillStyle=p.ground;x.fillRect(0,0,size,size);
  for(let i=0;i<220;i++){x.fillStyle=`rgba(90,58,34,${(r()*.07).toFixed(3)})`;x.fillRect(r()*size,r()*size,1+r()*1.6*s,1+r()*1.2*s);}
  const blob=(path,fill,stroke)=>{for(let pass=0;pass<2;pass++){x.save();x.globalAlpha=pass?.33:.94;x.translate(pass?J(2.2*s):0,pass?J(2.2*s):0);path();x.fillStyle=fill;x.fill();x.restore();}
    if(stroke){x.save();x.globalAlpha=.85;path();x.lineWidth=(.9+r()*.5)*s;x.strokeStyle=stroke;x.lineJoin="round";x.stroke();x.restore();}};
  const circ=(cx,cy,rad)=>()=>{x.beginPath();x.arc(cx*s,cy*s,rad*s,0,Math.PI*2);};
  const leaf=(cx,cy,ang,len,w)=>()=>{const ca=Math.cos(ang),sa=Math.sin(ang),px=-sa,py=ca;
    const tx=cx+ca*len,ty=cy+sa*len,mx=cx+ca*len*.5,my=cy+sa*len*.5;
    x.beginPath();x.moveTo(cx*s,cy*s);x.quadraticCurveTo((mx+px*w)*s,(my+py*w)*s,tx*s,ty*s);x.quadraticCurveTo((mx-px*w)*s,(my-py*w)*s,cx*s,cy*s);};
  /* angoli: quarti di cerchio che si uniscono tra piastrelle */
  [[0,0],[100,0],[0,100],[100,100]].forEach(([cx,cy])=>{blob(circ(cx,cy,31+J(1.6)),p.corner,p.line);
    for(let i=0;i<24;i++){const a=i/24*Math.PI*2;blob(circ(cx+Math.cos(a)*27,cy+Math.sin(a)*27,1.3),p.ground);}
    for(let i=0;i<12;i++){const a=i/12*Math.PI*2+J(.08),px=cx+Math.cos(a)*15,py=cy+Math.sin(a)*15;
      blob(()=>{x.beginPath();x.ellipse(px*s,py*s,(7+J(.7))*s,(3.4+J(.4))*s,a,0,Math.PI*2);},i%2?p.cornerIn:p.ground,p.line);}
    blob(circ(cx,cy,6.5),p.cornerIn,p.line);});
  /* foglie d'acanto sulle diagonali */
  [Math.PI/4,3*Math.PI/4,5*Math.PI/4,7*Math.PI/4].forEach(a=>{const bx=50+Math.cos(a)*13,by=50+Math.sin(a)*13;
    blob(leaf(bx,by,a+J(.12),21+J(2),6.5),p.leaf,p.line);
    x.save();x.globalAlpha=.6;x.strokeStyle=p.ground;x.lineWidth=.8*s;x.beginPath();x.moveTo(bx*s,by*s);x.lineTo((bx+Math.cos(a)*17)*s,(by+Math.sin(a)*17)*s);x.stroke();x.restore();});
  /* girali sugli assi */
  [0,Math.PI/2,Math.PI,3*Math.PI/2].forEach(a=>{const cx=50+Math.cos(a)*31,cy=50+Math.sin(a)*31;x.save();x.strokeStyle=p.corner;x.lineCap="round";x.lineWidth=2.4*s;x.globalAlpha=.9;
    x.beginPath();x.arc(cx*s,cy*s,6*s,a+.6,a+.6+Math.PI*1.4);x.stroke();x.lineWidth=1.8*s;x.beginPath();x.arc((cx+Math.cos(a+.6+Math.PI*1.4)*2.5)*s,(cy+Math.sin(a+.6+Math.PI*1.4)*2.5)*s,2.8*s,0,Math.PI*1.6);x.stroke();x.restore();
    blob(circ(50+Math.cos(a)*46,50+Math.sin(a)*46,2.6),p.petal2);});
  /* rosone centrale a otto petali */
  for(let i=0;i<8;i++){const a=i/8*Math.PI*2+J(.06),cx=50+Math.cos(a)*11,cy=50+Math.sin(a)*11;
    blob(()=>{x.beginPath();x.ellipse(cx*s,cy*s,(9+J(.8))*s,(4.6+J(.5))*s,a,0,Math.PI*2);},i%2?p.petal2:p.petal,p.line);}
  blob(circ(50,50,6.5),p.corner,p.line);blob(circ(50,50,3),p.cornerIn);
  /* smalto lucido */
  const g=x.createRadialGradient(28*s,24*s,0,28*s,24*s,80*s);g.addColorStop(0,"rgba(255,255,255,.30)");g.addColorStop(.5,"rgba(255,255,255,.06)");g.addColorStop(1,"rgba(255,255,255,0)");
  x.fillStyle=g;x.fillRect(0,0,size,size);
  x.strokeStyle="rgba(60,40,20,.12)";x.lineWidth=1.5*s;x.strokeRect(0,0,size,size);
  return _tileCache[key]=cv.toDataURL("image/png");
}

function renderMain(){$("main").innerHTML=SEC[sec]();
  document.querySelectorAll("#side [data-sec]").forEach(b=>b.setAttribute("aria-current",b.dataset.sec===sec));
  if(sec==="maiolica")drawQR();if(sec==="json")$("json").textContent=JSON.stringify(Object.assign({},cfg,{identity:Object.assign({},cfg.identity,{cover:cfg.identity.cover?"(foto caricata)":""})}),null,2);
  const cv=$("cover");if(cv)cv.onchange=()=>{const fl=cv.files&&cv.files[0];if(!fl)return;const r=new FileReader();r.onload=()=>shrink(r.result,900).then(u=>{cfg.identity.cover=u;save();renderAll();});r.readAsDataURL(fl);};
  const cx=$("cover-x");if(cx)cx.onclick=()=>{cfg.identity.cover="";save();renderAll();};}
function shrink(src,max){return new Promise(res=>{const im=new Image();im.onload=()=>{const s=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=im.width*s;c.height=im.height*s;c.getContext("2d").drawImage(im,0,0,c.width,c.height);res(c.toDataURL("image/jpeg",.82));};im.onerror=()=>res("");im.src=src;});}
const appURL=()=>`https://fondaco.it/s/${cfg.slug}`;
function drawQR(){const el=$("qr");$("url").textContent=appURL();el.innerHTML="";
  if(window.QRCode){new QRCode(el,{text:appURL(),width:200,height:200,colorDark:"#1c1712",colorLight:"#fbf7ee",correctLevel:QRCode.CorrectLevel.M});}else el.textContent="QR";
  $("order").onclick=()=>{$("order-n").textContent="Ordine pronto. In questo prototipo non parte nessun ordine.";};
  $("copyurl").onclick=()=>{navigator.clipboard&&navigator.clipboard.writeText(appURL()).then(()=>toast("Indirizzo copiato")).catch(()=>selectText($("url")));if(!navigator.clipboard)selectText($("url"));};}
function selectText(el){const r=document.createRange();r.selectNodeContents(el);const s=getSelection();s.removeAllRanges();s.addRange(r);toast("Indirizzo selezionato: copialo con Ctrl+C");}

  if(b.dataset.tile){cfg.identity.tile=+b.dataset.tile;b.parentElement.querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",x===b));save();renderApp();renderWho();return;}
  if(b.dataset.del){cfg[b.dataset.del].splice(+b.dataset.i,1);save();renderMain();renderApp();return;}
  if(b.dataset.addto){const k=b.dataset.addto;cfg[k].push(k==="rules"?"":k==="extras"?{n:"",p:0,on:true}:{c:"Mangiare",n:"",d:""});save();renderMain();renderApp();const ins=$("main").querySelectorAll(".li input[type=text]");ins.length&&ins[ins.length-(k==="tips"?2:1)].focus();}});
const slug=s=>s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
let saveT;function save(){try{localStorage.setItem("fondaco-cc",JSON.stringify(cfg));$("saved").textContent="Salvato sul dispositivo";}catch(_){$("saved").textContent="Modifiche non salvate";}}
function toast(m){const t=$("toast");t.textContent=m;t.hidden=false;clearTimeout(saveT);saveT=setTimeout(()=>t.hidden=true,2600);}
$("pub").onclick=()=>toast("Pubblicato: gli ospiti vedono la nuova versione. In questo prototipo non parte nulla.");

/* ============ App dell'ospite (anteprima) ============ */
function setLang(l){lang=l;document.querySelectorAll("[data-lang]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.lang===l));renderApp();}
document.querySelectorAll("[data-lang]").forEach(b=>b.onclick=()=>{if(b.dataset.lang==="en"&&!cfg.langs.en){toast("Attiva l'inglese in Identità per vedere l'anteprima");return;}setLang(b.dataset.lang);});
const TABI=[["home","home"],["servizi","coin"],["consigli","star"],["chat","chat"]];
$("tabs").onclick=e=>{const b=e.target.closest("[data-tab]");if(b){appTab=b.dataset.tab;renderApp();}};
function renderApp(){const t=T[lang],id=cfg.identity,a=cfg.arrival,m=id.main,ac=id.accent,band=`background-image:url(${tile(id.tile,64)})`;
  const todayIdx=(new Date().getDay()+6)%7,d0=DAYS[todayIdx],d1=DAYS[(todayIdx+1)%7];
  const hero=`<div class="hero" style="${id.cover?`background-image:url(${id.cover})`:`background:linear-gradient(150deg,${m} 0%,${m} 55%,${ac} 140%)`}"><small>${t.welcome} ${ESC(id.town)}</small><b>${ESC(id.name)||"La tua struttura"}</b><small style="text-transform:none;letter-spacing:0">${t.host}: ${ESC(id.host)}</small></div><div class="band" style="${band}"></div>`;
  let body="";
  if(appTab==="home"){const ex=cfg.extras.filter(x=>x.on&&x.n);
    body=`<div class="wel">${ESC(lang==="en"?id.welcome_en:id.welcome_it)}</div>
     <div class="two"><div class="card"><span class="k">${t.wifi}</span><b>${ESC(a.wifi)}</b><span class="s">${t.pw}: ${ESC(a.wifi_pw)}</span><button class="copy" type="button" style="background:${m}">${t.copy}</button></div>
      <div class="card"><span class="k">${t.door}</span><b style="font-family:var(--mono);letter-spacing:.2em">${ESC(a.door)}</b>${a.door_private?`<span class="lock">${t.doorLock}</span>`:""}</div></div>
     <div class="two"><div class="card"><span class="k">${t.in}</span><b>${t.from} ${ESC(a.checkin)}</b></div><div class="card"><span class="k">${t.out}</span><b>${t.by} ${ESC(a.checkout)}</b></div></div>
     <div class="card"><span class="k">${t.waste}</span><b>${t.today}: ${t.wasteN[cfg.waste[d0]]}</b><span class="s">${t.tomorrow}: ${t.wasteN[cfg.waste[d1]]}</span></div>
     ${a.how?`<div class="card"><span class="k">${t.how}</span><span class="s" style="color:#1c1712">${ESC(a.how)}</span>${a.parking?`<span class="s">${t.park}: ${ESC(a.parking)}</span>`:""}</div>`:""}
     ${cfg.rules.filter(Boolean).length?`<div class="card"><span class="k">${t.rules}</span>${cfg.rules.filter(Boolean).map(r=>`<span class="s" style="color:#1c1712">· ${ESC(r)}</span>`).join("")}</div>`:""}
     ${ex.length?`<div class="card"><span class="k">${t.extras}</span><b>${ESC(ex[0].n)}</b><span class="s">${ex[0].p} €${ex.length>1?` · +${ex.length-1}`:""}</span></div>`:""}
     ${cfg.network.discount>0?`<div class="card" style="background:${ac}"><span class="k" style="color:#1c1712">${t.next}</span><b>−${cfg.network.discount}%</b><span class="s" style="color:#1c1712">${t.nextT}</span></div>`:""}`;}
  else if(appTab==="servizi"){const ex=cfg.extras.filter(x=>x.on&&x.n);body=`<div class="card"><span class="k">${t.extras}</span>${ex.length?ex.map(x=>`<div class="svcrow"><span><b style="font-size:.86rem">${ESC(x.n)}</b></span><span style="display:grid;justify-items:end;gap:3px"><span class="p">${x.p} €</span><button class="add" type="button" style="background:${m}">${t.add}</button></span></div>`).join(""):`<span class="s">—</span>`}</div>`;}
  else if(appTab==="consigli"){body=`<div class="card"><span class="k">${t.tips} ${ESC(id.host)}</span>${cfg.tips.filter(x=>x.n).map(x=>`<div class="tip"><span style="color:${m}">${ESC(x.c)}</span><b style="font-size:.88rem">${ESC(x.n)}</b><span class="s">${ESC(x.d)}</span></div>`).join("")||`<span class="s">—</span>`}</div>`;}
  else{body=`<div class="card"><span class="k">${t.chat} · ${ESC(id.host)}</span><div class="chat"><div class="msg h">${t.chatHi}</div><div class="msg g" style="background:${m}">${t.chatG}</div></div></div>`;}
  $("view").innerHTML=hero+`<div class="body">${body}</div>`;
  $("tabs").innerHTML=TABI.map(([k,ic],i)=>`<button type="button" data-tab="${k}" style="${appTab===k?`color:${m}`:""}" aria-pressed="${appTab===k}"><svg viewBox="0 0 24 24">${IC[ic]}</svg>${t.tab[i]}</button>`).join("");}
function renderWho(){$("who-sw").style.backgroundImage=`url(${tile(cfg.identity.tile,68)})`;$("who-n").textContent=cfg.identity.name||"La tua struttura";$("who-t").textContent=`${cfg.identity.type} · ${cfg.identity.town}`;}
function renderAll(){renderMain();renderApp();renderWho();}
renderAll();
</script>

</body>
